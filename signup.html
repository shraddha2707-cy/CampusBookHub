<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CampusBookHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #ffffff 0%, #f4fbfb 55%, #d9f2ef 100%);
            color: #1a1a2e; min-height: 100vh; display: flex; position: relative;
            overflow-x: hidden; overflow-y: auto;
        }
        main { width: 100%; display: flex; justify-content: center; align-items: center; padding: 24px 20px 80px; position: relative; z-index: 5; }
        .signup-card {
            background: #fff; border-radius: 22px; padding: 42px 42px 34px; max-width: 480px; width: 100%;
            box-shadow: 0 20px 60px rgba(7, 156, 155, .14);
        }
        h1 { color: #121324; font-size: 32px; font-weight: 800; text-align: center; margin-bottom: 8px; }
        .subtitle { color: #66708b; font-size: 14px; text-align: center; margin-bottom: 28px; }
        .subtitle a, .terms a, .login-link a { color: #057574; font-weight: 600; text-decoration: none; }
        .form-group { margin-bottom: 18px; }
        label { display: block; color: #17213d; font-size: 14px; font-weight: 600; margin-bottom: 7px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper > i:first-child { position: absolute; left: 17px; color: #079c9b; font-size: 18px; pointer-events: none; }
        .form-group:nth-child(3) .input-wrapper > i:first-child, .form-group:nth-child(4) .input-wrapper > i:first-child { color: #6e58ed; }
        input {
            width: 100%; padding: 14px 48px; border: 2px solid #c8e8e5; border-radius: 9px;
            color: #1a1a2e; font-size: 14px; outline: none;
        }
        input:focus { border-color: #079c9b; }
        input::placeholder { color: #78829f; }
        .password-toggle { position: absolute; right: 16px; color: #64708e; cursor: pointer; }
        .terms { display: flex; align-items: center; gap: 9px; color: #26304b; font-size: 12px; margin: 6px 0 24px; }
        .terms input { width: 16px; height: 16px; padding: 0; accent-color: #079c9b; }
        .btn {
            width: 100%; border-radius: 9px; padding: 14px; display: flex; justify-content: center; align-items: center;
            gap: 11px; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        .btn-signup { background: #079c9b; border: 0; color: #fff; margin-bottom: 18px; }
        .btn-signup:hover { background: #057574; }
        .divider { display: flex; align-items: center; gap: 18px; color: #78829f; font-size: 13px; margin: 10px 0 18px; }
        .divider::before, .divider::after { content: ''; height: 1px; background: #c8e8e5; flex: 1; }
        .btn-google { background: #fff; border: 2px solid #c8e8e5; color: #1a1a2e; margin-bottom: 26px; }
        .btn-google:hover { border-color: #079c9b; }
        .login-link { text-align: center; color: #66708b; font-size: 14px; }
        .decoration { position: absolute; color: #a8dedd; opacity: .7; pointer-events: none; z-index: 2; }
        .wave-bg { position: absolute; bottom: 0; left: 0; width: 100%; overflow: hidden; line-height: 0; z-index: 1; }
        .wave-bg svg { display: block; width: calc(100% + 1.3px); height: 145px; }
        .wave-bg .shape-fill { fill: #8bd3d0; opacity: .72; }
        @media (max-width: 600px) {
            main { padding: 20px 15px 70px; }
            .signup-card { padding: 30px 24px; }
            h1 { font-size: 27px; }
        }
    </style>
</head>
<body>
    <i class="fa-solid fa-graduation-cap decoration" style="top: 18%; left: 4%; font-size: 52px; transform: rotate(15deg);"></i>
    <i class="fa-solid fa-book-stack decoration" style="top: 50%; right: 5%; font-size: 50px; transform: rotate(8deg);"></i>
    <i class="fa-solid fa-backpack decoration" style="bottom: 18%; left: 5%; font-size: 52px; transform: rotate(-10deg);"></i>
    <i class="fa-solid fa-circle decoration" style="top: 30%; left: 11%; font-size: 13px;"></i>
    <i class="fa-solid fa-circle decoration" style="top: 12%; right: 8%; font-size: 12px;"></i>
    <i class="fa-solid fa-plus decoration" style="top: 50%; left: 10%; font-size: 20px;"></i>
    <i class="fa-solid fa-plus decoration" style="top: 58%; right: 8%; font-size: 20px;"></i>
    <main>
        <section class="signup-card">
            <h1>Create Your Account</h1>
            <p class="subtitle">Join us and start your <a href="frontpage.html">campus journey.</a></p>
            <form id="signupForm">
                <div class="form-group"><label for="fullName">Full Name</label><div class="input-wrapper"><i class="fa-regular fa-user"></i><input id="fullName" type="text" placeholder="Enter your full name" required></div></div>
                <div class="form-group"><label for="email">Email Address</label><div class="input-wrapper"><i class="fa-regular fa-envelope"></i><input id="email" type="email" placeholder="Enter your email address" required></div></div>
                <div class="form-group"><label for="password">Password</label><div class="input-wrapper"><i class="fa-solid fa-lock"></i><input id="password" type="password" placeholder="Create a password" required><i class="fa-solid fa-eye password-toggle" data-target="password"></i></div></div>
                <div class="form-group"><label for="confirmPassword">Confirm Password</label><div class="input-wrapper"><i class="fa-solid fa-lock"></i><input id="confirmPassword" type="password" placeholder="Confirm your password" required><i class="fa-solid fa-eye password-toggle" data-target="confirmPassword"></i></div></div>
                <label class="terms"><input type="checkbox" required> <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span></label>
                <button type="submit" class="btn btn-signup"><i class="fa-solid fa-user-plus"></i> Sign Up</button>
            </form>
            <div class="divider">or sign up with</div>
            <button type="button" class="btn btn-google"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Sign up with Google</button>
            <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
        </section>
    </main>
    <div class="wave-bg"><svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,50 C150,10 350,90 500,40 C650,-10 900,80 1200,50 L1200,120 L0,120 Z" class="shape-fill"></path></svg></div>
    <script>
        document.querySelectorAll('.password-toggle').forEach(function (toggle) {
            toggle.addEventListener('click', function () {
                const input = document.getElementById(toggle.dataset.target);
                input.type = input.type === 'password' ? 'text' : 'password';
                toggle.classList.toggle('fa-eye');
                toggle.classList.toggle('fa-eye-slash');
            });
        });
        document.getElementById('signupForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            if (password !== document.getElementById('confirmPassword').value) {
                alert('Passwords do not match.');
                return;
            }
            fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fullName: document.getElementById('fullName').value,
                    email: document.getElementById('email').value,
                    password
                })
            }).then(async function (response) {
                const result = await response.json();
                if (!response.ok) throw new Error(result.error);
                alert('Account created. Please log in.');
                window.location.href = 'login.html';
            }).catch(function (error) {
                alert(error.message || 'Could not create the account.');
            });
        });
    </script>
</body>
</html>
