<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/settings.js" defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subjects - CampusBookHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#122044; --teal:#079c9b; --line:#e2edf1; --muted:#60708d; --soft:#eefafa; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Poppins',sans-serif; }
    body { min-height:100vh; color:var(--navy); background:#fff; }
    a, button, input { font:inherit; }
    .topbar { height:68px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { display:inline-flex; align-items:center; gap:10px; color:var(--navy); text-decoration:none; font-size:25px; font-weight:800; }
    .brand i, .brand span { color:var(--teal); } .brand i { font-size:32px; }
    .account { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:700; }
    .avatar { width:38px; height:38px; display:grid; place-items:center; border-radius:50%; background:#e8f9f8; color:var(--teal); font-size:18px; }
    .shell { display:flex; min-height:calc(100vh - 68px); }
    aside { width:250px; padding:18px 15px; border-right:1px solid var(--line); flex-shrink:0; }
    .nav-list { display:grid; gap:8px; } .nav-item { width:100%; padding:10px 14px; display:flex; align-items:center; gap:16px; border:0; border-radius:8px; background:transparent; color:var(--navy); text-align:left; text-decoration:none; font-size:14px; cursor:pointer; }
    .nav-item:hover { background:#f1f8f8; } .nav-item i { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:#eef8f8; color:var(--teal); font-size:18px; }
    .nav-item:nth-child(2) i { background:#e4f6f5; } .nav-item:nth-child(3) i { background:#fff1dc; color:#ff9d13; } .nav-item:nth-child(4) i { background:#eeebff; color:#6e58ed; } .nav-item:nth-child(6) i { background:#fff0f1; color:#fa3131; }
    .nav-item.active { background:var(--teal); color:#fff; box-shadow:0 6px 18px rgba(7,156,155,.15); } .nav-item.active i { background:transparent; color:#fff; } .nav-divider { height:1px; margin:17px 0 9px; background:var(--line); }
    main { flex:1; min-width:0; padding:20px; } .content { max-width:1180px; height:calc(100vh - 108px); min-height:0; margin:0 auto; display:flex; flex-direction:column; }
    .upload-tabs { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; border:1px solid #dfeaf1; border-bottom:0; border-radius:12px 12px 0 0; overflow:hidden; background:rgba(255,255,255,.24); }
    .upload-tab { display:flex; align-items:center; justify-content:center; gap:6px; min-height:42px; padding:0 6px; border:0; border-right:1px solid #dfeaf1; background:rgba(255,255,255,.05); color:#2f5674; text-decoration:none; font-size:.76rem; font-weight:600; white-space:nowrap; }
    .upload-tab:last-child { border-right:0; } .upload-tab i { color:var(--teal); font-size:1rem; } .upload-tab.active { background:#dff6f5; color:#067d7b; box-shadow:inset 0 -3px 0 var(--teal); } .upload-tab.active i { color:#067d7b; }
    .panel { flex:1; min-height:0; overflow:auto; border:1px solid #dbe9ee; border-top:0; border-radius:0 0 12px 12px; padding:18px 8px 24px; }
    .toolbar { display:flex; align-items:center; gap:24px; margin-bottom:16px; } .search-box { flex:1; height:42px; display:flex; align-items:center; gap:10px; padding:0 14px; border:1px solid #dce9ee; border-radius:10px; color:#83a0b7; } .search-box input { width:100%; border:0; outline:0; color:var(--navy); font-size:12px; } .search-box input::placeholder { color:#8da5b8; }
    .select-control { min-width:190px; height:42px; display:flex; align-items:center; gap:10px; padding:0 12px; border:1px solid #dfeaf1; border-radius:8px; background:#fff; color:#2f5674; font-size:.76rem; font-weight:600; }
    .branch-control { width:190px; min-width:0; flex:0 0 190px; }
    .select-control i { color:var(--teal); font-size:1rem; } .select-control select { min-width:0; flex:1; border:0; outline:0; background:transparent; color:#2f5674; font-size:.76rem; font-weight:600; cursor:pointer; }
    .view-tabs { display:flex; flex:0 0 auto; gap:8px; }
    .view-tab { min-width:110px; min-height:42px; padding:0 12px; display:flex; align-items:center; justify-content:flex-start; gap:10px; border:1px solid #dfeaf1; border-radius:8px; background:#fff; color:#2f5674; cursor:pointer; font-size:.76rem; font-weight:600; white-space:nowrap; }
    .view-tab i { color:var(--teal); font-size:1rem; }
    .view-tab .tab-arrow { margin-left:2px; color:#60708d; font-size:.65rem; }
    .view-tab:focus-visible { outline:2px solid var(--teal); outline-offset:-2px; }
    .cards-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; } .file-card { min-height:150px; padding:12px; border:1px solid #e2edf1; border-radius:10px; box-shadow:0 5px 13px rgba(18,32,68,.04); display:flex; flex-direction:column; justify-content:space-between; }
    .file-top { display:flex; justify-content:space-between; gap:8px; } .file-heading { display:flex; gap:10px; min-width:0; } .file-badge { width:34px; height:38px; flex-shrink:0; display:grid; place-items:center; border-radius:6px; background:#f55353; color:#fff; font-size:10px; font-weight:700; } .file-name { color:#1a4772; font-size:12px; line-height:1.35; font-weight:700; word-break:break-word; }
    .subject-tag { width:max-content; margin-top:4px; padding:3px 8px; border-radius:10px; background:#dff6f5; color:#168684; font-size:9px; } .heart-button { width:28px; height:28px; display:grid; place-items:center; border:0; background:transparent; color:#67c8c8; cursor:pointer; } .heart-button.saved { color:var(--teal); }
    .meta-row { display:flex; justify-content:space-between; gap:8px; margin:12px 0 8px; color:#66849b; font-size:9px; } .meta-row span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .description { min-height:25px; color:#58758d; font-size:10px; line-height:1.45; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:9px; color:#5f889b; font-size:10px; } .read-button { min-width:100px; padding:7px 14px; display:inline-flex; justify-content:center; gap:7px; border-radius:7px; background:var(--teal); color:#fff; text-decoration:none; font-size:10px; font-weight:700; }
    .empty { padding:100px 20px; text-align:center; color:var(--muted); } .empty i { display:block; margin-bottom:12px; color:#8bd8d4; font-size:42px; } .empty h2 { color:var(--navy); font-size:18px; margin-bottom:6px; } .empty p { font-size:12px; }
    @media(max-width:980px) { .shell{display:block} aside{width:100%;padding:10px;border-right:0;border-bottom:1px solid var(--line)} .nav-list{display:flex;gap:6px;overflow-x:auto}.nav-item{width:auto;white-space:nowrap}.content{height:auto;min-height:0}.toolbar{flex-wrap:wrap}.search-box{flex-basis:100%}.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media(max-width:640px) { .topbar{padding:0 16px}.brand{font-size:20px}.account{display:none}main{padding:12px}.upload-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.search-box{grid-column:1/-1}.select-control{min-width:0}.branch-control{width:auto;flex:initial}.view-tabs{grid-column:1/-1;justify-self:start;gap:6px}.view-tab{min-width:0;padding:0 8px;gap:6px;font-size:10px}.cards-grid{grid-template-columns:1fr}.panel{padding:12px 6px} }
  </style>
  <script>(function(){var nativeFetch=window.fetch;window.fetch=function(url,options){options=options||{};var token=sessionStorage.getItem('campusBookHubSession');if(token)options.headers=Object.assign({},options.headers,{Authorization:'Bearer '+token});return nativeFetch(url,options);};})();</script>
</head>
<body>
  <header class="topbar"><a class="brand" href="dashboard.html"><i class="fa-solid fa-book-open"></i> Campus<span>BookHub</span></a><span class="account"><span class="avatar"><i class="fa-regular fa-user"></i></span><span id="accountName">Loading...</span></span></header>
  <div class="shell"><aside><nav class="nav-list"><a class="nav-item" href="dashboard.html"><i class="fa-regular fa-user"></i>Profile</a><a class="nav-item" href="buybooks.html"><i class="fa-solid fa-cart-shopping"></i>Buy Books</a><a class="nav-item" href="mylistings.html"><i class="fa-solid fa-tag"></i>Sell Books</a><a class="nav-item active" href="uploadpdf.html"><i class="fa-regular fa-file-lines"></i>Upload PDF / Notes</a><span class="nav-divider"></span><button class="nav-item" type="button"><i class="fa-solid fa-gear"></i>Settings</button></nav></aside>
    <main><div class="content"><nav class="upload-tabs"><a id="subjectsTab" class="upload-tab active" href="subjects.html"><i class="fa-solid fa-book-open"></i><span>Subjects</span></a><a class="upload-tab" href="uploadpdf.html"><i class="fa-solid fa-cloud-arrow-up"></i><span>Upload PDF</span></a><a class="upload-tab" href="myuploads.html"><i class="fa-solid fa-user"></i><span>My Uploads</span></a><a class="upload-tab" href="whitelisted.html"><i class="fa-solid fa-heart"></i><span>Whitelisted</span></a></nav>
      <section class="panel"><div class="toolbar"><label class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="search" placeholder="Search PDFs by title, subject or keyword..." /></label><label class="select-control branch-control"><i class="fa-solid fa-code-branch"></i><select id="branchFilter" aria-label="Filter by branch"><option value="">All Branches</option></select></label><label class="select-control"><i class="fa-regular fa-calendar"></i><select id="yearFilter" aria-label="Filter by year"><option value="">All Years</option><option>First Year</option><option>Second Year</option><option>Third Year</option><option>Fourth Year</option></select></label><label class="select-control"><i class="fa-solid fa-book-open"></i><select id="subjectFilter" aria-label="Filter by subject"><option value="">All Subjects</option></select></label><nav class="view-tabs" aria-label="Filter PDFs by document type"><button id="questionPapersView" class="view-tab" type="button" aria-pressed="false"><i class="fa-solid fa-file-circle-question" aria-hidden="true"></i><span>Question Papers</span><i class="fa-solid fa-chevron-down tab-arrow" aria-hidden="true"></i></button></nav></div><div id="cardsGrid" class="cards-grid"></div><div id="empty" class="empty" hidden><i class="fa-regular fa-folder-open"></i><h2>No documents found</h2><p>Try another branch, year or search term.</p></div></section>
    </div></main>
  </div>
  <script>
    let isQuestionPapersFilter = new URLSearchParams(window.location.search).get('view') === 'question-papers';
    const grid = document.getElementById('cardsGrid'); const empty = document.getElementById('empty'); const searchInput = document.getElementById('searchInput'); const branchFilter = document.getElementById('branchFilter'); const yearFilter = document.getElementById('yearFilter'); const subjectFilter = document.getElementById('subjectFilter'); let uploads = [];
    function esc(value){return String(value || '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function size(bytes){return bytes < 1048576 ? Math.round(bytes / 1024) + ' KB' : (bytes / 1048576).toFixed(1) + ' MB';}
    function date(value){const d=new Date(value);return Number.isNaN(d.getTime())?'Recently':d.toLocaleDateString();}
    function isQuestionPaper(upload){return typeof upload.isQuestionPaper==='boolean'?upload.isQuestionPaper:/question|paper|pyq|exam|previous year|past paper/i.test((upload.title||'')+' '+(upload.fileName||'')+' '+(upload.description||''));}
    function normalized(value){return String(value||'').trim();}
    function matchesCurrentFilters(upload){const branch=branchFilter.value.trim().toLowerCase();const year=yearFilter.value.trim().toLowerCase();return (!isQuestionPapersFilter||isQuestionPaper(upload))&&(!branch||normalized(upload.branch).toLowerCase()===branch)&&(!year||normalized(upload.year).toLowerCase()===year);}
    function updateBranchOptions(){const selected=branchFilter.value;const branches=[...new Set(uploads.map(upload=>normalized(upload.branch)).filter(Boolean))].sort((a,b)=>a.localeCompare(b));branchFilter.innerHTML='<option value="">All Branches</option>'+branches.map(branch=>`<option value="${esc(branch)}">${esc(branch)}</option>`).join('');if(branches.includes(selected))branchFilter.value=selected;}
    function updateSubjectOptions(){const selected=subjectFilter.value;const branch=branchFilter.value.trim().toLowerCase();const year=yearFilter.value.trim().toLowerCase();const subjects=[...new Set(uploads.filter(upload=>(!isQuestionPapersFilter||isQuestionPaper(upload))&&(!branch||normalized(upload.branch).toLowerCase()===branch)&&(!year||normalized(upload.year).toLowerCase()===year)).map(upload=>normalized(upload.subject)).filter(Boolean))].sort((a,b)=>a.localeCompare(b));subjectFilter.innerHTML='<option value="">All Subjects</option>'+subjects.map(subject=>`<option value="${esc(subject)}">${esc(subject)}</option>`).join('');if(subjects.includes(selected))subjectFilter.value=selected;}
    function visibleUploads(){const query=searchInput.value.trim().toLowerCase();const subject=subjectFilter.value.trim().toLowerCase();return uploads.filter(upload=>{const searchable=[upload.branch,upload.year,upload.title,upload.subject,upload.fileName,upload.description].map(value=>String(value||'').toLowerCase()).join(' ');const matchesSearch=!query||searchable.includes(query);const matchesSubject=!subject||normalized(upload.subject).toLowerCase()===subject;return matchesCurrentFilters(upload)&&matchesSubject&&matchesSearch;});}
    function render(){const items=visibleUploads();empty.hidden=items.length>0;grid.innerHTML=items.map(upload=>`<article class="file-card"><div><div class="file-top"><div class="file-heading"><div class="file-badge">PDF</div><div><div class="file-name">${esc(upload.title||upload.fileName)}</div><div class="subject-tag">${esc(upload.subject||'Others')}${upload.year?' · '+esc(upload.year):''}</div></div></div><button class="heart-button ${upload.isWishlisted?'saved':''}" data-id="${upload.id}" aria-label="${upload.isOwner?'Your upload':upload.isWishlisted?'Remove from wishlist':'Add to wishlist'}" ${upload.isOwner?'disabled':''}><i class="fa-${upload.isWishlisted?'solid':'regular'} fa-heart"></i></button></div><div class="meta-row"><span><i class="fa-regular fa-user"></i> Uploaded by ${esc(upload.uploaderName||'Campus user')}</span><span><i class="fa-regular fa-calendar"></i> ${esc(date(upload.createdAt))}</span></div><div class="description">${esc(upload.description||'Shared notes and study material.')}</div></div><div class="card-footer"><span><i class="fa-regular fa-file-lines"></i> ${size(upload.size)}</span><a class="read-button" href="/api/uploads/${encodeURIComponent(upload.id)}" target="_blank" rel="noopener"><i class="fa-regular fa-eye"></i>Read</a></div></article>`).join('');grid.querySelectorAll('.heart-button:not(:disabled)').forEach(button=>button.addEventListener('click',async()=>{const saved=button.classList.contains('saved');const endpoint=saved?`/api/wishlist/${encodeURIComponent(button.dataset.id)}`:'/api/wishlist';const options=saved?{method:'DELETE'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uploadId:button.dataset.id})};const response=await fetch(endpoint,options);if(response.ok){button.classList.toggle('saved');button.innerHTML=`<i class="fa-${saved?'regular':'solid'} fa-heart"></i>`;button.setAttribute('aria-label',saved?'Add to wishlist':'Remove from wishlist');}}));}
    function setDocumentTypeFilter(questionPapers){isQuestionPapersFilter=questionPapers;document.getElementById('questionPapersView').setAttribute('aria-pressed',String(questionPapers));updateSubjectOptions();render();}
    document.getElementById('questionPapersView').addEventListener('click',()=>setDocumentTypeFilter(!isQuestionPapersFilter));
    subjectFilter.addEventListener('change',render);searchInput.addEventListener('input',render);branchFilter.addEventListener('change',()=>{updateSubjectOptions();render();});yearFilter.addEventListener('change',()=>{updateSubjectOptions();render();});setDocumentTypeFilter(isQuestionPapersFilter);fetch('/api/me').then(async response=>{if(!response.ok){location.href='login.html';return;}const user=await response.json();document.getElementById('accountName').textContent=user.fullName||'Profile';return fetch('/api/uploads/shared?includeOwn=true');}).then(async response=>{if(!response)return;const payload=await response.json();uploads=Array.isArray(payload.uploads)?payload.uploads:[];updateBranchOptions();updateSubjectOptions();render();}).catch(()=>location.href='login.html');
  </script>
</body>
</html>
