<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/settings.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CampusBookHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #122044;
            --gray-text: #60708d;
            --line: #e6edf2;
            --bg: #ffffff;
            --panel: #ffffff;
            --teal: #079c9b;
            --teal-soft: #e9f8f7;
            --teal-dark: #057574;
            --orange: #f0a33f;
            --purple: #8f6ae8;
            --green: #2bb673;
            --yellow: #f7cf5a;
            --red: #ef5c74;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #fff;
            color: var(--navy);
            min-height: 100vh;
        }

        a, button {
            font: inherit;
        }

        .topbar {
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 25px;
            font-weight: 800;
            color: var(--navy);
            text-decoration: none;
        }

        .brand .brand-accent {
            color: var(--teal);
        }

        .brand i {
            color: var(--teal);
            font-size: 32px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }


        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--navy);
        }

        .user-pill .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #e8f9f8;
            color: var(--teal);
            font-size: 16px;
        }

        .page-shell {
            display: flex;
            min-height: calc(100vh - 68px);
        }

        .sidebar {
            width: 250px;
            flex-shrink: 0;
            background: #fff;
            border-right: 1px solid var(--line);
            padding: 18px 15px;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            width: 100%;
            border: none;
            background: transparent;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--navy);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .nav-item:hover {
            background: #f1f8f8;
        }

        .nav-item i {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #eef8f8;
            font-size: 18px;
            color: var(--teal);
        }

        .nav-item:nth-child(3) i {
            background: #fff1dc;
            color: #ff9d13;
        }

        .nav-item:nth-child(4) i {
            background: #eeebff;
            color: #6e58ed;
        }

        .nav-item:nth-child(6) i {
            background: #fff0f1;
            color: #fa3131;
        }

        .nav-item:nth-child(7) i {
            background: #e9f8f7;
            color: var(--teal);
        }

        .nav-item.active {
            color: #fff;
            background: var(--teal);
            box-shadow: 0 6px 18px rgba(7, 156, 155, 0.15);
        }

        .nav-item.active i {
            background: rgba(255,255,255,0.16);
            color: #fff;
        }

        .nav-divider {
            height: 1px;
            background: var(--line);
            margin: 16px 0 9px;
        }

        .main-panel {
            flex: 1;
            padding: 20px;
        }

        .content-wrap {
            max-width: 1180px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 26px 18px 22px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            box-shadow: 0 4px 18px rgba(20, 33, 50, 0.02);
        }

        .profile-summary {
            display: flex;
            align-items: center;
            gap: 22px;
            min-width: 0;
        }

        .profile-photo {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #e8f9f8;
            border: 1px solid #dfeaf6;
            display: grid;
            place-items: center;
            color: var(--teal);
            font-size: 30px;
            flex-shrink: 0;
        }

        .profile-text h1 {
            margin: 0 0 4px;
            font-size: 26px;
            line-height: 1.2;
            letter-spacing: -0.04em;
            font-weight: 700;
        }

        .profile-role {
            display: inline-block;
            margin-bottom: 12px;
            padding: 3px 10px;
            border-radius: 14px;
            background: var(--teal-soft);
            color: var(--teal-dark);
            font-size: 12px;
            font-weight: 600;
        }

        .profile-meta {
            display: grid;
            gap: 8px;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gray-text);
            font-size: 13px;
        }

        .meta-row i {
            width: 16px;
            text-align: center;
            color: #5b6981;
        }

        .stats-box {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0;
            width: min(52%, 540px);
            min-height: 128px;
            background: var(--teal-soft);
            border-radius: 8px;
            overflow: hidden;
        }

        .stat-item {
            display: grid;
            place-items: center;
            text-align: center;
            padding: 10px 12px;
            border-right: 1px solid rgba(138, 173, 178, 0.35);
        }

        .stat-item:last-child {
            border-right: none;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin-bottom: 8px;
            font-size: 18px;
            color: #fff;
        }

        .stat-item:nth-child(1) .stat-icon { background: var(--teal); }
        .stat-item:nth-child(2) .stat-icon { background: var(--orange); }
        .stat-item:nth-child(3) .stat-icon { background: var(--green); }

        .stat-count {
            font-size: 22px;
            line-height: 1;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--navy);
        }

        .stat-label {
            color: var(--gray-text);
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }

        .history-card {
            margin-top: 22px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 4px 18px rgba(20, 33, 50, 0.02);
            padding: 18px 18px 10px 18px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .history-header h2 {
            font-size: 17px;
            font-weight: 700;
        }

        .view-all {
            text-decoration: none;
            color: var(--teal);
            font-size: 12px;
            font-weight: 600;
        }

        .history-tabs {
            display: flex;
            gap: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 6px;
        }

        .tab-btn {
            border: none;
            background: transparent;
            color: var(--gray-text);
            font-size: 12px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: #fff;
            background: var(--teal);
            box-shadow: 0 6px 18px rgba(7, 156, 155, 0.15);
        }

        .history-table {
            display: flex;
            flex-direction: column;
        }

        .history-empty {
            padding: 36px 12px;
            color: var(--gray-text);
            font-size: 13px;
            text-align: center;
        }

        .table-head,
        .table-row {
            display: grid;
            grid-template-columns: minmax(180px, 2.2fr) minmax(120px, 0.9fr) minmax(120px, 0.9fr) minmax(60px, 0.5fr) 42px;
            align-items: center;
            gap: 10px;
            padding: 12px 6px;
            border-bottom: 1px solid #edf2f6;
        }

        .table-head {
            color: #4a5a70;
            font-size: 12px;
            font-weight: 600;
            padding-top: 12px;
        }

        .table-row {
            min-height: 64px;
        }

        .book-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .mini-cover {
            width: 34px;
            height: 46px;
            border-radius: 6px;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 7px;
            font-weight: 700;
            line-height: 1.2;
            text-align: center;
            padding: 2px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }

        .history-file-icon {
            width: 34px;
            height: 46px;
            flex: 0 0 34px;
            display: grid;
            place-items: center;
            border-radius: 6px;
            background: #e6f7f6;
            color: var(--teal);
            font-size: 16px;
        }

        .cover-data { background: linear-gradient(135deg, #0d3c6d, #0a1d3d); }
        .cover-chem { background: linear-gradient(135deg, #14a26b, #0d5a47); }
        .cover-physics { background: linear-gradient(135deg, #4a6df7, #1b2658); }
        .cover-math { background: linear-gradient(135deg, #f0a33f, #af5d05); }

        .book-text {
            min-width: 0;
        }

        .book-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--navy);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-author {
            font-size: 11px;
            color: #697b91;
            margin-top: 4px;
        }

        .type-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid transparent;
            width: fit-content;
        }

        .type-pill.bought {
            background: rgba(10,165,161,0.12);
            color: var(--teal);
            border-color: rgba(10,165,161,0.15);
        }

        .type-pill.sold {
            background: rgba(122, 102, 233, 0.12);
            color: #5a52c9;
            border-color: rgba(122, 102, 233, 0.15);
        }

        .type-pill.exchanged {
            background: rgba(143,106,232,0.12);
            color: #694ecb;
            border-color: rgba(143,106,232,0.18);
        }

        .type-pill.pdf {
            background: rgba(240,163,63,0.12);
            color: #a96f08;
            border-color: rgba(240,163,63,0.16);
        }

        .date-cell,
        .amount-cell {
            color: var(--gray-text);
            font-size: 12px;
            font-weight: 500;
        }

        .amount-cell {
            color: var(--navy);
            font-weight: 600;
            text-align: left;
        }

        .arrow-cell {
            text-align: center;
            color: var(--gray-text);
            font-size: 14px;
        }

        .history-footer {
            display: flex;
            justify-content: flex-start;
            padding: 16px 6px 8px;
        }

        .footer-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--teal);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }

        @media (max-width: 980px) {
            .profile-card { flex-direction: column; align-items: flex-start; }
            .stats-box { width: 100%; max-width: 520px; }
        }

        @media (max-width: 680px) {
            .topbar { padding: 0 16px; }
            .brand { font-size: 20px; }
            .brand i { font-size: 27px; }
            .user-pill span:last-child { display: none; }
            .page-shell { display: block; }
            .sidebar { width: 100%; padding: 10px; border: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
            .nav-list { display: flex; flex-direction: row; min-width: max-content; }
            .nav-item { width: auto; padding: 7px 12px; white-space: nowrap; }
            .nav-item i { width: 30px; height: 30px; flex-basis: 30px; }
            .nav-divider { display: none; }
            .main-panel { padding: 12px; }
            .profile-card { padding: 18px 14px; }
            .profile-summary { align-items: flex-start; }
            .profile-text h1 { font-size: 22px; }
            .stats-box { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .table-head { display: none; }
            .table-row { grid-template-columns: 1fr; gap: 6px; padding: 12px 6px; }
            .arrow-cell { text-align: left; }
        }

        @media (max-width: 420px) {
            .brand { font-size: 20px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="dashboard.html">
            <i class="fa-solid fa-book-open"></i>Campus <span class="brand-accent">BookHub</span>
        </a>

        <div class="top-actions">
            <div class="user-pill">
                <span class="user-avatar"><i class="fa-regular fa-user"></i></span>
                <span id="accountName">Shraddha Shelke</span>
            </div>
        </div>
    </header>

    <div class="page-shell">
        <aside class="sidebar">
            <nav class="nav-list" aria-label="Sidebar Navigation">
                <button class="nav-item active" type="button"><i class="fa-regular fa-user"></i>Profile</button>
                <a class="nav-item" href="buybooks.html"><i class="fa-solid fa-cart-shopping"></i>Buy Books</a>
                <a class="nav-item" href="mylistings.html"><i class="fa-solid fa-tag"></i>Sell Books</a>
                <a class="nav-item" href="uploadpdf.html"><i class="fa-regular fa-file-lines"></i>Upload PDF / Notes</a>
                <div class="nav-divider"></div>
                
                <button class="nav-item" type="button"><i class="fa-solid fa-gear"></i>Settings</button>
            </nav>
        </aside>

        <main class="main-panel">
            <div class="content-wrap">
                <section class="profile-card">
                    <div class="profile-summary">
                        <div class="profile-photo"><i class="fa-regular fa-user"></i></div>
                        <div class="profile-text">
                            <h1 id="profileName">SHRADDHA SHELKE</h1>
                            <span class="profile-role">Student</span>
                            <div class="profile-meta">
                                <div class="meta-row"><i class="fa-regular fa-envelope"></i><span id="profileEmail">shrad...@goa...com</span></div>
                                <div class="meta-row"><i class="fa-regular fa-calendar-days"></i><span id="joinedDate">Joined August 21, 2026</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="stats-box" aria-label="Profile summary statistics">
                        <div class="stat-item">
                            <div class="stat-icon"><i class="fa-solid fa-bag-shopping"></i></div>
                            <div class="stat-count" id="boughtCount">0</div>
                            <div class="stat-label">Bought</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-icon"><i class="fa-solid fa-tag"></i></div>
                            <div class="stat-count" id="soldCount">0</div>
                            <div class="stat-label">Sold</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-icon"><i class="fa-regular fa-file-lines"></i></div>
                            <div class="stat-count" id="uploadsCount">0</div>
                            <div class="stat-label">PDFs Uploaded</div>
                        </div>
                    </div>
                </section>

                <section class="history-card">
                    <div class="history-header">
                        <h2>History Overview</h2>
                    </div>

                    <div class="history-tabs" role="tablist" aria-label="History categories">
                        <button class="tab-btn active" type="button" role="tab" aria-selected="true" data-history-filter="all">All</button>
                        <button class="tab-btn" type="button" role="tab" aria-selected="false" data-history-filter="bought">Bought</button>
                        <button class="tab-btn" type="button" role="tab" aria-selected="false" data-history-filter="sold">Sold</button>
                        <button class="tab-btn" type="button" role="tab" aria-selected="false" data-history-filter="pdfs">PDFs Uploaded</button>
                    </div>

                    <div class="history-table" role="tabpanel">
                        <div class="table-head">
                            <div>Book / Item</div>
                            <div>Type</div>
                            <div>Date</div>
                            <div>Amount</div>
                            <div></div>
                        </div>
                        <div id="historyRows"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        (function () {
            const nativeFetch = window.fetch;
            window.fetch = function (url, options) {
                options = options || {};
                const token = sessionStorage.getItem('campusBookHubSession');
                if (token) {
                    options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + token });
                }
                return nativeFetch(url, options);
            };
        })();

        const fallbackUser = {
            fullName: 'SHRADDHA SHELKE',
            email: 'shradha.shelke2512018@goa...ac.in',
            createdAt: '2026-08-21T00:00:00.000Z'
        };

        function populateUser(user) {
            const fullName = user?.fullName || fallbackUser.fullName;
            const email = user?.email || fallbackUser.email;
            const createdAt = user?.createdAt || fallbackUser.createdAt;
            const createdDate = new Date(createdAt);

            document.getElementById('accountName').textContent = fullName;
            document.getElementById('profileName').textContent = fullName.toUpperCase();
            document.getElementById('profileEmail').textContent = email;
            document.getElementById('joinedDate').textContent = Number.isNaN(createdDate.getTime())
                ? 'Joined August 21, 2026'
                : `Joined ${createdDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
        }

        let uploadedHistory = [];
        let historyLoadFailed = false;
        let transactionHistory = [];
        let transactionsLoadFailed = false;
        let activeHistoryFilter = 'all';

        function renderHistory(filter) {
            const rows = document.getElementById('historyRows');
            rows.replaceChildren();
            const visibleTransactions = filter === 'all'
                ? transactionHistory
                : transactionHistory.filter(function (transaction) { return transaction.type.toLowerCase() === filter; });
            const visibleUploads = filter === 'all' || filter === 'pdfs' ? uploadedHistory : [];
            const entries = visibleTransactions.map(function (transaction) {
                return Object.assign({ kind: 'transaction', date: transaction.confirmedAt }, transaction);
            }).concat(visibleUploads.map(function (upload) {
                return Object.assign({ kind: 'pdf', type: 'PDF Uploaded', date: upload.createdAt }, upload);
            })).sort(function (first, second) {
                return new Date(second.date) - new Date(first.date);
            });

            if (entries.length === 0) {
                let emptyMessage;
                if ((filter === 'all' || filter === 'pdfs') && historyLoadFailed) {
                    emptyMessage = 'Could not load uploads. Please sign in again.';
                } else if ((filter === 'all' || filter === 'bought' || filter === 'sold') && transactionsLoadFailed) {
                    emptyMessage = 'Could not load transactions. Please sign in again.';
                } else if (filter === 'pdfs') {
                    emptyMessage = 'No PDFs uploaded yet.';
                } else if (filter === 'bought') {
                    emptyMessage = 'No completed purchases yet.';
                } else if (filter === 'sold') {
                    emptyMessage = 'No completed sales yet.';
                } else {
                    emptyMessage = 'No activity recorded yet.';
                }
                rows.innerHTML = `<div class="history-empty" role="status">${emptyMessage}</div>`;
                return;
            }

            entries.forEach(function (entry) {
                const row = document.createElement('div');
                row.className = 'table-row';

                const itemCell = document.createElement('div');
                itemCell.className = 'book-cell';
                const fileIcon = document.createElement('span');
                fileIcon.className = 'history-file-icon';
                const icon = document.createElement('i');
                icon.className = entry.kind === 'pdf'
                    ? 'fa-regular fa-file-lines'
                    : entry.type === 'Bought' ? 'fa-solid fa-bag-shopping' : 'fa-solid fa-tag';
                icon.setAttribute('aria-hidden', 'true');
                fileIcon.appendChild(icon);
                const bookText = document.createElement('div');
                bookText.className = 'book-text';
                const title = document.createElement('div');
                title.className = 'book-name';
                title.textContent = entry.title || entry.fileName || 'Untitled item';
                const subject = document.createElement('div');
                subject.className = 'book-author';
                subject.textContent = entry.kind === 'pdf'
                    ? entry.subject || entry.fileName || 'PDF upload'
                    : entry.counterpartyName || 'Campus user';
                bookText.append(title, subject);
                itemCell.append(fileIcon, bookText);

                const typeCell = document.createElement('div');
                const typePill = document.createElement('span');
                typePill.className = 'type-pill ' + (entry.kind === 'pdf' ? 'pdf' : entry.type.toLowerCase());
                const typeIcon = document.createElement('i');
                typeIcon.className = entry.kind === 'pdf'
                    ? 'fa-regular fa-file-lines'
                    : entry.type === 'Bought' ? 'fa-solid fa-bag-shopping' : 'fa-solid fa-tag';
                typeIcon.setAttribute('aria-hidden', 'true');
                typePill.append(typeIcon, document.createTextNode(entry.type));
                typeCell.appendChild(typePill);
                const dateCell = document.createElement('div');
                dateCell.className = 'date-cell';
                const createdDate = new Date(entry.date);
                dateCell.textContent = Number.isNaN(createdDate.getTime())
                    ? 'Date unavailable'
                    : createdDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                const amountCell = document.createElement('div');
                amountCell.className = 'amount-cell';
                amountCell.textContent = entry.kind === 'pdf' ? '—' : '₹' + entry.price;

                row.append(itemCell, typeCell, dateCell, amountCell, document.createElement('div'));
                rows.appendChild(row);
            });
        }

        fetch('/api/me')
            .then(async function (response) {
                if (!response.ok) {
                    if (response.status === 401) {
                        sessionStorage.removeItem('campusBookHubSession');
                        window.location.href = '/login.html';
                        return;
                    }
                    populateUser(fallbackUser);
                    return;
                }
                populateUser(await response.json());
            })
            .catch(function () {
                populateUser(fallbackUser);
            });

        fetch('/api/uploads')
            .then(function (response) {
                if (!response.ok) throw new Error('Could not load uploads.');
                return response.json();
            })
            .then(function (result) {
                uploadedHistory = Array.isArray(result.uploads) ? result.uploads : [];
                document.getElementById('uploadsCount').textContent = uploadedHistory.length;
                renderHistory(activeHistoryFilter);
            })
            .catch(function () {
                historyLoadFailed = true;
                renderHistory(activeHistoryFilter);
            });

        fetch('/api/transactions')
            .then(function (response) {
                if (!response.ok) throw new Error('Could not load transactions.');
                return response.json();
            })
            .then(function (result) {
                transactionHistory = Array.isArray(result.transactions) ? result.transactions : [];
                document.getElementById('boughtCount').textContent = transactionHistory.filter(function (transaction) { return transaction.type === 'Bought'; }).length;
                document.getElementById('soldCount').textContent = transactionHistory.filter(function (transaction) { return transaction.type === 'Sold'; }).length;
                renderHistory(activeHistoryFilter);
            })
            .catch(function () {
                transactionsLoadFailed = true;
                renderHistory(activeHistoryFilter);
            });

        document.querySelectorAll('.nav-item').forEach(function (item) {
            item.addEventListener('click', function () {
                document.querySelectorAll('.nav-item').forEach(function (button) {
                    button.classList.remove('active');
                });
                item.classList.add('active');
            });
        });

        document.querySelectorAll('[data-history-filter]').forEach(function (tab) {
            tab.addEventListener('click', function () {
                document.querySelectorAll('[data-history-filter]').forEach(function (button) {
                    button.classList.remove('active');
                    button.setAttribute('aria-selected', 'false');
                });
                tab.classList.add('active');
                tab.setAttribute('aria-selected', 'true');
                activeHistoryFilter = tab.dataset.historyFilter;
                renderHistory(activeHistoryFilter);
            });
        });

        renderHistory(activeHistoryFilter);

    </script>
</body>
</html>
