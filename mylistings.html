<script>
var allListings=[];
var list=document.getElementById('listingList');
function renderListings(){
	var query=document.getElementById('search').value.toLowerCase().trim();
	var status=document.getElementById('status').value;
	var sort=document.getElementById('sort').value;
	var items=allListings.filter(function(item){return (!query||item.title.toLowerCase().includes(query))&&(status==='All Status'||item.status===status);});
	items.sort(function(a,b){if(sort==='low')return a.price-b.price;if(sort==='high')return b.price-a.price;return sort==='oldest'?new Date(a.createdAt)-new Date(b.createdAt):new Date(b.createdAt)-new Date(a.createdAt);});
	if(!items.length){list.innerHTML='<div class="empty"><i class="fa-solid fa-tag"></i>No selling books found.<br><a href="sellbooks.html">Add a new book</a></div>';return;}
	list.innerHTML='';
	items.forEach(function(item){
		var row=document.createElement('article');
		row.className='listing-row';
		row.dataset.listingId=item.id;
		row.innerHTML='<div class="listing-image"></div><div><h2 class="book-title"></h2><p class="author"></p><p class="branch"><i class="fa-solid fa-book-open"></i></p><p class="listing-description-visible"></p></div><p class="price"></p><p class="listing-info"></p><div class="actions"><button class="action">View Details</button><button class="action danger">Deactivate</button></div>';
		var imageContainer=row.querySelector('.listing-image');
		if(item.photos&&item.photos[0]){var image=document.createElement('img');image.src=item.photos[0];image.alt=item.title;imageContainer.appendChild(image);}else{var placeholder=document.createElement('i');placeholder.className='fa-solid fa-book';imageContainer.appendChild(placeholder);}
		row.querySelector('.book-title').textContent=item.title;
		row.querySelector('.author').textContent='By '+item.author;
		row.querySelector('.branch').append(document.createTextNode(item.branch));
		var description=row.querySelector('.listing-description-visible');
		description.textContent=item.description||'No description provided.';
		description.title=description.textContent;
		row.querySelector('.price').innerHTML='₹'+item.price+'<small>Price'+(item.negotiable?' · Negotiable':'')+'</small>';
		row.querySelector('.listing-info').textContent=item.status+' · Listed '+new Date(item.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' · '+item.condition+' condition';
		list.appendChild(row);
	});
}
function showError(error){document.getElementById('message').textContent=error.message;document.getElementById('message').style.display='block';renderListings();}
fetch('/api/me').then(async function(response){if(!response.ok)throw new Error('Please log in to view your selling books.');var user=await response.json();document.getElementById('accountName').textContent=user.fullName;return fetch('/api/listings');}).then(function(response){if(!response.ok)throw new Error('Please log in to view your selling books.');return response.json();}).then(function(data){allListings=data.listings.map(function(item){return Object.assign({},item,{status:item.status||'Active'});});renderListings();}).catch(showError);
document.getElementById('search').addEventListener('input',renderListings);
document.getElementById('status').addEventListener('change',renderListings);
document.getElementById('sort').addEventListener('change',renderListings);
</script>

<script>
	document.getElementById('listingList').addEventListener('click', function (event) {
	if (!event.target.closest('.action')) return;
	var button = event.target.closest('.action');
	var row = button.closest('.listing-row');
	var listing = allListings.find(function (item) { return item.id === row.dataset.listingId; });
	if (!listing) return;
	if (button.classList.contains('danger')) {
		button.disabled = true;
		fetch('/api/listings/' + encodeURIComponent(listing.id) + '/deactivate', { method: 'DELETE' }).then(function (response) {
			return response.text().then(function (text) {
				var result;
				try { result = JSON.parse(text); } catch (error) { result = { error: text || 'Could not deactivate the listing.' }; }
				if (response.status === 401) { window.location.href = 'login.html'; return null; }
				if (!response.ok) throw new Error(result.error || 'Could not deactivate the listing.');
				return result;
			});
		}).then(function (result) {
			if (!result) return;
			allListings = allListings.filter(function (item) { return item.id !== listing.id; });
			renderListings();
		}).catch(function (error) { button.disabled = false; alert(error.message); });
		return;
	}
	window.location.href = 'bookdetails.html?id=' + encodeURIComponent(listing.id);
});
var descriptionStyle = document.createElement('style');
descriptionStyle.textContent = '.listing-description-visible{max-width:100%;margin-top:6px;color:#52627e;font-size:11px;line-height:1.5;white-space:normal;overflow-wrap:anywhere}';
document.head.appendChild(descriptionStyle);
var listingObserver = new MutationObserver(function () {
	document.querySelectorAll('.listing-row').forEach(function (row) {
		if (row.querySelector('.listing-description-visible')) return;
		var listing = allListings.find(function (item) { return item.title === row.querySelector('.book-title').textContent; });
		if (!listing) return;
		if (listing.status && listing.status !== 'Active') return;
		var description = document.createElement('p');
		description.className = 'listing-description-visible';
		description.title = listing.description || 'No description provided.';
		description.textContent = listing.description || 'No description provided.';
		row.querySelector('.book-title').parentElement.appendChild(description);
		if (listing.photos && listing.photos.length) {
			var photoStrip = document.createElement('div');
			photoStrip.className = 'listing-photos';
			listing.photos.forEach(function (photo, index) {
				var thumbnail = document.createElement('img');
				thumbnail.className = 'listing-photo-thumb';
				thumbnail.src = photo;
				thumbnail.alt = 'Uploaded book photo ' + (index + 1);
				photoStrip.appendChild(thumbnail);
			});
			row.querySelector('.book-title').parentElement.appendChild(photoStrip);
		}
	});
});
listingObserver.observe(document.getElementById('listingList'), { childList: true, subtree: true });
</script>
<script>
(function () {
	var attempts = 0;
	var displayTimer = setInterval(function () {
		attempts += 1;
		document.querySelectorAll('.listing-row').forEach(function (row) {
			var titleElement = row.querySelector('.book-title');
			if (!titleElement) return;
			var listing = allListings.find(function (item) { return item.title === titleElement.textContent; });
			if (!listing) return;
			if (listing.status && listing.status !== 'Active') return;
			var details = titleElement.parentElement;
			if (!details.querySelector('.listing-description-visible')) {
				var description = document.createElement('p');
				description.className = 'listing-description-visible';
				description.textContent = listing.description || 'No description provided.';
				description.title = description.textContent;
				details.appendChild(description);
			}
			if (!details.querySelector('.listing-photos') && listing.photos && listing.photos.length) {
				var photoStrip = document.createElement('div');
				photoStrip.className = 'listing-photos';
				listing.photos.forEach(function (photo, index) {
					var thumbnail = document.createElement('img');
					thumbnail.className = 'listing-photo-thumb';
					thumbnail.src = photo;
					thumbnail.alt = 'Uploaded book photo ' + (index + 1);
					photoStrip.appendChild(thumbnail);
				});
				details.appendChild(photoStrip);
			}
		});
		if (attempts > 50) clearInterval(displayTimer);
	}, 100);
})();
</script>
<script>
(function () {
	var inquiries = [];
	function enhanceListing(row) {
		if (row.querySelector('.listing-metrics')) return;
		var listing = allListings.find(function (item) { return item.id === row.dataset.listingId; });
		var viewCount = listing && Number.isFinite(Number(listing.views)) ? Number(listing.views) : 0;
		var inquiryCount = listing && Number.isFinite(Number(listing.inquiryCount)) ? Number(listing.inquiryCount) : 0;
		var core = document.createElement('div');
		core.className = 'listing-core';
		while (row.firstChild) core.appendChild(row.firstChild);
		row.appendChild(core);
		core.querySelector('.action').textContent = 'Edit Listing';
		var metrics = document.createElement('div');
		metrics.className = 'listing-metrics';
		metrics.innerHTML = '<div class="metric"><i class="fa-regular fa-eye"></i><div><strong>' + viewCount + '</strong><span>Views</span></div></div><div class="metric inquiry-metric"><i class="fa-regular fa-message"></i><div><strong>' + inquiryCount + '</strong><span>Inquiries</span></div><button class="inquiry-toggle" type="button">View Inquiries <i class="fa-solid fa-arrow-right"></i></button></div>';
		core.appendChild(metrics);
		var inquiryPanel = document.createElement('section');
		inquiryPanel.className = 'inquiries';
		inquiryPanel.innerHTML = '<h3>People who messaged you</h3>';
		inquiries.forEach(function (inquiry) {
			var item = document.createElement('div');
			item.className = 'inquiry';
			item.innerHTML = '<span class="inquiry-avatar">' + inquiry.initials + '</span><div><strong>' + inquiry.name + ' <small>New</small></strong><p>' + inquiry.message + '</p></div><time>' + inquiry.time + '</time><button class="chat-action" type="button">Chat</button><i class="fa-solid fa-ellipsis-vertical"></i>';
			inquiryPanel.appendChild(item);
		});
		var footer = document.createElement('div');
		footer.className = 'inquiries-footer';
		footer.textContent = 'View All Messages  ›';
		inquiryPanel.appendChild(footer);
		row.appendChild(inquiryPanel);
		metrics.querySelector('.inquiry-toggle').addEventListener('click', function () {
			var listing = allListings.find(function (item) { return item.id === row.dataset.listingId; });
			if (listing) window.location.href = 'inquiries.html?id=' + encodeURIComponent(listing.id);
		});
	}
	new MutationObserver(function () {
		document.querySelectorAll('.listing-row').forEach(enhanceListing);
	}).observe(document.getElementById('listingList'), { childList: true });
})();
</script>
<script>
(function () {
	function refreshMetrics() {
		fetch('/api/listings', { cache: 'no-store' })
			.then(function (response) { return response.ok ? response.json() : null; })
			.then(function (result) {
				if (!result) return;
				(result.listings || []).forEach(function (listing) {
					var row = Array.from(document.querySelectorAll('.listing-row')).find(function (item) {
						return item.dataset.listingId === listing.id;
					});
					if (!row) return;
					var counts = row.querySelectorAll('.listing-metrics .metric strong');
					if (counts[0]) counts[0].textContent = Number(listing.views) || 0;
					if (counts[1]) counts[1].textContent = Number(listing.inquiryCount) || 0;
				});
			})
			.catch(function () {});
	}

	new MutationObserver(refreshMetrics).observe(document.getElementById('listingList'), { childList: true });
	window.addEventListener('focus', refreshMetrics);
	document.addEventListener('visibilitychange', function () {
		if (!document.hidden) refreshMetrics();
	});
	window.setInterval(function () {
		if (!document.hidden) refreshMetrics();
	}, 10000);
	refreshMetrics();
})();
</script>
