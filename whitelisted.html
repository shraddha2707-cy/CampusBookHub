<!DOCTYPE html>
<html lang="en">
<head>
       <script src="/settings.js" defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whitelisted Documents - CampusBookHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#122044; --teal:#079c9b; --line:#e7edf2; --muted:#60708d; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Poppins', sans-serif; }
    body { min-height:100vh; background:#fff; color:var(--navy); }
    a, button, input { font:inherit; }
    .topbar { height:68px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { display:inline-flex; align-items:center; gap:10px; color:var(--navy); text-decoration:none; font-size:25px; font-weight:800; }
    .brand i, .brand span { color:var(--teal); } .brand i { font-size:32px; }
    .account { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:700; }
    .avatar { width:38px; height:38px; display:grid; place-items:center; border-radius:50%; background:#e8f9f8; color:var(--teal); font-size:18px; }
    .shell { display:flex; min-height:calc(100vh - 68px); }
    aside { width:250px; padding:18px 15px; border-right:1px solid var(--line); flex-shrink:0; }
    .nav-list { display:grid; gap:8px; }
    .nav-item { width:100%; padding:10px 14px; display:flex; align-items:center; gap:16px; border:0; border-radius:8px; background:transparent; color:var(--navy); text-align:left; text-decoration:none; font-size:14px; cursor:pointer; transition:all .2s ease; }
    .nav-item:hover { background:#f1f8f8; }
    .nav-item i { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:#eef8f8; color:var(--teal); font-size:18px; }
    .nav-item:nth-child(2) i { background:#e4f6f5; color:#079c9b; } .nav-item:nth-child(3) i { background:#fff1dc; color:#ff9d13; } .nav-item:nth-child(4) i { background:#eeebff; color:#6e58ed; } .nav-item:nth-child(6) i { background:#fff0f1; color:#fa3131; } .nav-item:nth-child(7) i { background:#e9f8f7; color:#079c9b; }
    .nav-item.active { background:var(--teal); color:#fff; box-shadow:0 6px 18px rgba(7,156,155,.15); } .nav-item.active i { background:transparent; color:#fff; }
    .nav-divider { height:1px; margin:17px 0 9px; background:var(--line); }
    main { flex:1; min-width:0; padding:20px; }
    .content { max-width:1180px; margin:0 auto; height:calc(100vh - 108px); min-height:0; display:flex; flex-direction:column; }
    .upload-tabs { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; border:1px solid #dfeaf1; border-bottom:0; border-radius:12px 12px 0 0; overflow:hidden; background:rgba(255,255,255,0.24); }
    .upload-tab { display:flex; align-items:center; justify-content:center; gap:6px; min-height:42px; padding:0 6px; border:0; background:rgba(255,255,255,0.05); color:#2f5674; font-size:.76rem; font-weight:600; cursor:pointer; border-right:1px solid #dfeaf1; text-decoration:none; white-space:nowrap; }
    .upload-tab:last-child { border-right:0; } .upload-tab i { font-size:1rem; color:var(--teal); }
    .upload-tab.active { background:#dff6f5; color:var(--teal-dark); box-shadow:inset 0 -3px 0 var(--teal); } .upload-tab.active i { color:var(--teal-dark); }
    .page-panel { border:1px solid #ddeaf0; border-top:0; border-radius:0 0 12px 12px; padding:18px; min-height:540px; }
    .panel-heading { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:20px; }
    .panel-heading h1 { font-size:22px; } .panel-heading p { margin-top:4px; color:var(--muted); font-size:12px; }
    .browse-link { display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:9px; background:#eefbfb; color:var(--teal); text-decoration:none; font-size:12px; font-weight:700; white-space:nowrap; }
    .cards-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:20px 26px; }
    .file-card { min-height:240px; padding:16px 14px 12px; border:1px solid #e4ebf1; border-radius:12px; box-shadow:0 8px 18px rgba(18,32,68,.05); display:flex; flex-direction:column; justify-content:space-between; }
    .file-top { display:flex; justify-content:space-between; } .file-badge { width:52px; height:56px; display:grid; place-items:center; border-radius:10px; background:linear-gradient(180deg,#ff695f,#ef4f49); color:#fff; font-size:16px; font-weight:700; }
    .menu-button, .heart-button { width:32px; height:32px; display:grid; place-items:center; border:0; border-radius:8px; background:transparent; color:#8092a9; cursor:pointer; }
    .heart-button { border:1px solid #dfe9ef; border-radius:50%; color:var(--teal); } .heart-button:hover { background:#eefbfb; }
    .file-info { display:flex; flex-direction:column; gap:8px; margin-top:16px; } .file-name { font-size:15px; line-height:1.4; font-weight:600; word-break:break-word; } .file-size, .meta-row { color:var(--muted); font-size:11px; } .meta-row { display:flex; gap:8px; align-items:center; }
    .file-actions { display:flex; gap:10px; margin-top:18px; } .action-btn { flex:1; min-height:34px; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid #d7f1f0; border-radius:8px; background:#effcfb; color:var(--teal); text-decoration:none; font-size:12px; font-weight:600; }
    .empty-state { min-height:330px; display:grid; place-items:center; text-align:center; color:var(--navy); } .empty-state i { color:#8bd8d4; font-size:48px; margin-bottom:16px; } .empty-state h2 { font-size:19px; margin-bottom:8px; } .empty-state p { color:#7890b7; font-size:13px; margin-bottom:18px; }
    .empty-state .browse-link { display:inline-flex; }
    @media(max-width:980px) { .shell{display:block;} aside{width:100%; padding:10px; border-right:0; border-bottom:1px solid var(--line);} .nav-list{display:flex; gap:6px; overflow-x:auto;} .nav-item{width:auto; white-space:nowrap;} .content{height:auto; min-height:0;} .cards-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
    @media(max-width:640px) { .topbar{padding:0 16px;} .brand{font-size:20px;} .account{display:none;} main{padding:12px;} .upload-tabs{grid-template-columns:repeat(2,minmax(0,1fr));} .page-panel{padding:12px;} .panel-heading{align-items:flex-start; flex-direction:column;} .cards-grid{grid-template-columns:1fr;} }
  </style>
  <script>(function(){var nativeFetch=window.fetch;window.fetch=function(url,options){options=options||{};var token=sessionStorage.getItem('campusBookHubSession');if(token)options.headers=Object.assign({},options.headers,{Authorization:'Bearer '+token});return nativeFetch(url,options);};})();</script>
</head>
<body>
  <header class="topbar"><a class="brand" href="dashboard.html"><i class="fa-solid fa-book-open"></i> Campus<span>BookHub</span></a><span class="account"><span class="avatar"><i class="fa-regular fa-user"></i></span><span id="accountName">Loading...</span></span></header>
  <div class="shell">
    <aside><nav class="nav-list">
      <a class="nav-item" href="dashboard.html"><i class="fa-regular fa-user"></i>Profile</a>
      <a class="nav-item" href="buybooks.html"><i class="fa-solid fa-cart-shopping"></i>Buy Books</a>
      <a class="nav-item" href="mylistings.html"><i class="fa-solid fa-tag"></i>Sell Books</a>
      <a class="nav-item active" href="uploadpdf.html"><i class="fa-regular fa-file-lines"></i>Upload PDF / Notes</a>
      <span class="nav-divider"></span><button class="nav-item" type="button"><i class="fa-solid fa-gear"></i>Settings</button>
    </nav></aside>
    <main><div class="content">
      <nav class="upload-tabs" aria-label="Upload sections"><a class="upload-tab" href="subjects.html"><i class="fa-solid fa-book-open"></i><span>Subjects</span></a><a class="upload-tab" href="uploadpdf.html"><i class="fa-solid fa-cloud-arrow-up"></i><span>Upload PDF</span></a><a class="upload-tab" href="myuploads.html"><i class="fa-solid fa-user"></i><span>My Uploads</span></a><a class="upload-tab active" href="whitelisted.html"><i class="fa-solid fa-heart"></i><span>Whitelisted</span></a></nav>
      <section class="page-panel"><div class="panel-heading"><div><h1>Whitelisted Documents</h1><p>PDFs and notes you saved to read later.</p></div></div><div id="cardsGrid" class="cards-grid" aria-live="polite"></div><div id="emptyState" class="empty-state" hidden><div><i class="fa-regular fa-heart"></i><h2>Your reading list is empty</h2><p>Save useful PDFs uploaded by other users and find them here later.</p></div></div></section>
    </div></main>
  </div>
  <script>
    const grid = document.getElementById('cardsGrid');
    const emptyState = document.getElementById('emptyState');
    function formatSize(bytes) { return bytes < 1024 * 1024 ? Math.round(bytes / 1024) + ' KB' : (bytes / (1024 * 1024)).toFixed(1) + ' MB'; }
    function formatDate(value) { const date = new Date(value); return Number.isNaN(date.getTime()) ? 'Recently' : date.toLocaleDateString(); }
    function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function render(items) {
      emptyState.hidden = items.length > 0;
      grid.innerHTML = items.map(upload => `<article class="file-card"><div><div class="file-top"><div class="file-badge">PDF</div><button class="heart-button" data-id="${upload.id}" aria-label="Remove from wishlist"><i class="fa-solid fa-heart"></i></button></div><div class="file-info"><div class="file-name">${escapeHtml(upload.title || upload.fileName)}</div><div class="file-size">${formatSize(upload.size)}</div><div class="meta-row"><i class="fa-regular fa-clock"></i>Saved on ${escapeHtml(formatDate(upload.createdAt))}</div></div></div><div class="file-actions"><a class="action-btn" href="/api/uploads/${encodeURIComponent(upload.id)}" target="_blank" rel="noopener"><i class="fa-regular fa-eye"></i>Read</a><a class="action-btn" href="/api/uploads/${encodeURIComponent(upload.id)}?download=1"><i class="fa-solid fa-download"></i>Download</a></div></article>`).join('');
      grid.querySelectorAll('.heart-button').forEach(button => button.addEventListener('click', async () => { await fetch('/api/wishlist/' + encodeURIComponent(button.dataset.id), { method:'DELETE' }); button.closest('.file-card').remove(); if (!grid.children.length) emptyState.hidden = false; }));
    }
    fetch('/api/me').then(async response => { if (!response.ok) { location.href='login.html'; return; } const user = await response.json(); document.getElementById('accountName').textContent = user.fullName || 'Profile'; return fetch('/api/wishlist'); }).then(async response => { if (!response) return; const payload = await response.json(); render(Array.isArray(payload.uploads) ? payload.uploads : []); }).catch(() => { location.href='login.html'; });
  </script>
</body>
</html>
