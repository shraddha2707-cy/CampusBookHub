<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBookHub</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 42px;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 25px;
            font-weight: 800;
            color: #17213d;
        }

        .logo i {
            color: #079c9b;
            font-size: 38px;
        }

        .logo span {
            color: #079c9b;
        }

        .auth-buttons {
            display: flex;
            gap: 18px;
        }

        .btn {
            padding: 11px 27px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-login {
            background: transparent;
            border: 2px solid #079c9b;
            color: #078f90;
        }

        .btn-login:hover {
            background: #e8f8f7;
        }

        .btn-signup {
            background-color: #079c9b;
            border: 2px solid #079c9b;
            color: white;
        }

        .btn-signup:hover {
            background-color: #057574;
        }

        /* Main Container */
        .container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 12px 30px 30px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 5;
        }

        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 22px;
        }

        .hero-text {
            flex: 1;
            max-width: 510px;
        }

        .hero-text h1 {
            font-size: 50px;
            line-height: 1.18;
            font-weight: 800;
            color: #17213d;
            margin-bottom: 18px;
        }

        .highlight-purple { color: #079c9b; }
        .highlight-blue { color: #17213d; }
        .highlight-pink { color: #eca116; }

        .underline {
            width: 80px;
            height: 5px;
            background-color: #079c9b;
            border-radius: 4px;
            margin-top: 10px;
        }

        /* Hero Image Container */
        .hero-image {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hero-image img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.08));
        }

        /* Category Features Bar */
        .features-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            padding: 8px 0;
            margin-top: 0;
            transform: translateY(0);
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 28px;
            position: relative;
            text-decoration: none;
            color: #17213d;
        }

        .feature-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background-color: #d9f2ef;
        }

        .icon-circle {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .feature-item p {
            font-weight: 700;
            font-size: 15px;
        }

        /* Feature Circle Color Themes */
        .buy-bg { background-color: #bce7df; color: #078f90; }
        .sell-bg { background-color: #bce7df; color: #078f90; }
        .rent-bg { background-color: #bce7df; color: #078f90; }
        .share-bg { background-color: #bce7df; color: #078f90; }

        /* Background Decorative Elements */
        .bg-illustration {
            position: absolute;
            color: #a8dedd;
            opacity: 0.4;
            pointer-events: none;
            z-index: 1;
        }

        /* Decorative Bottom Wave Shape */
        .wave-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            overflow: hidden;
            line-height: 0;
            z-index: 1;
        }

        .wave-bg svg {
            position: relative;
            display: block;
            width: calc(130% + 1.3px);
            height: 172px;
        }

        .wave-bg .shape-fill {
            fill: #8bd3d0;
            opacity: 0.72;
        }

        .wave-bg svg:first-child .shape-fill {
            fill: #c8ece9;
            opacity: 0.8;
        }

        .wave-bg svg:first-child {
            position: absolute;
            bottom: 20px;
            left: 0;
            height: 165px;
        }

        /* Responsive Layout */
        @media (max-width: 900px) {
            header {
                padding: 20px 24px;
            }
            
            .hero {
                flex-direction: column;
                text-align: center;
            }

            .hero-text h1 {
                font-size: 42px;
            }

            .hero-image img {
                max-width: 85%;
            }

            .underline {
                margin: 10px auto 0;
            }

            .features-bar {
                flex-wrap: wrap;
                gap: 20px;
            }

            .feature-item {
                padding: 0 18px;
            }

            .feature-item:not(:last-child)::after {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-book-open"></i>
            Campus<span>BookHub</span>
        </div>
        <div class="auth-buttons">
            <a href="login.html" class="btn btn-login">
                <i class="fa-regular fa-user"></i> Login
            </a>
            <a href="signup.html" class="btn btn-signup">
                <i class="fa-solid fa-user-plus"></i> Sign Up
            </a>
        </div>
    </header>

    <!-- Background Decorative Outline Icons -->
    <i class="fa-regular fa-book bg-illustration" style="top: 15%; left: 5%; font-size: 55px; transform: rotate(-15deg);"></i>
    <i class="fa-solid fa-graduation-cap bg-illustration" style="top: 18%; right: 8%; font-size: 50px; transform: rotate(15deg);"></i>
    <i class="fa-solid fa-graduation-cap bg-illustration" style="top: 55%; right: 4%; font-size: 40px; transform: rotate(-10deg);"></i>
    <i class="fa-regular fa-circle bg-illustration" style="top: 28%; left: 40%; font-size: 14px;"></i>
    <i class="fa-solid fa-plus bg-illustration" style="top: 18%; left: 36%; font-size: 16px;"></i>
    <i class="fa-solid fa-plus bg-illustration" style="top: 35%; right: 6%; font-size: 18px;"></i>

    <!-- Main Hero Content -->
    <main class="container">
        <section class="hero">
            <div class="hero-text">
                <h1>
                    Buy, <span class="highlight-purple">sell</span>,<br>
                    <span class="highlight-pink">rent</span> or <span class="highlight-purple">share</span> books
                </h1>
                <div class="underline"></div>
            </div>

            <div class="hero-image">
                <!-- Replace src with your rendered 3D stack image or mockup asset -->
                 <img src="fpbook.png" alt="Stack of books with plant and coffee cup">
            </div>
        </section>

        <!-- Category Options -->
        <section class="features-bar">
            <div class="feature-item">
                <div class="icon-circle buy-bg">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <p>Buy</p>
            </div>

            <div class="feature-item">
                <div class="icon-circle sell-bg">
                    <i class="fa-solid fa-tag"></i>
                </div>
                <p>Sell</p>
            </div>

            <div class="feature-item">
                <div class="icon-circle rent-bg">
                    <i class="fa-regular fa-calendar-days"></i>
                </div>
                <p>Rent</p>
            </div>

            <div class="feature-item">
                <div class="icon-circle share-bg">
                    <i class="fa-solid fa-user-group"></i>
                </div>
                <p>Share</p>
            </div>
        </section>
    </main>

    <!-- Curved Decorative Bottom Wave -->
    <div class="wave-bg">
        <svg data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,20 C160,15 250,100 470,75 C690,48 790,120 1000,65 C1090,42 1140,20 1200,18 L1200,120 L0,120 Z" class="shape-fill"></path>
        </svg>
        <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,0 C150,90 350,-40 500,40 C650,120 900,20 1200,60 L1200,120 L0,120 Z" class="shape-fill"></path>
        </svg>
    </div>

</body>
</html>
