<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusBookHub</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, #f4fbfb 55%, #d9f2ef 100%);
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
            padding: 15px 20px 35px;
            position: relative;
            z-index: 5;
        }

        /* Login Card */
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 32px 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(7, 156, 155, 0.14);
        }

        .login-card h2 {
            font-size: 32px;
            font-weight: 800;
            color: #121324;
            text-align: center;
            margin-bottom: 12px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .login-card .subtitle a {
            color: #079c9b;
            text-decoration: none;
            font-weight: 600;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #78bdb9;
            font-size: 18px;
            pointer-events: none;
        }

        .input-wrapper > i:first-child { color: #079c9b; }
        .form-group:nth-of-type(2) .input-wrapper > i:first-child { color: #6e58ed; }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #c8e8e5;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #079c9b;
        }

        .form-group input::placeholder {
            color: #78909a;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            cursor: pointer;
            color: #079c9b;
            font-size: 18px;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 24px;
        }

        .forgot-password a {
            color: #079c9b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .forgot-password a:hover {
            color: #057574;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #079c9b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-login:hover {
            background-color: #057574;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 13px;
        }

        /* Google Login Button */
        .btn-google {
            width: 100%;
            padding: 14px;
            background-color: white;
            border: 2px solid #c8e8e5;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            color: #1a1a2e;
            margin-bottom: 20px;
        }

        .btn-google:hover {
            border-color: #079c9b;
            background-color: #fafafa;
        }

        .google-icon {
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" font-size="16" font-weight="bold" fill="%234285F4">G</text></svg>') no-repeat center;
            background-size: contain;
        }

        /* Sign Up Link */
        .signup-link {
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .signup-link a {
            color: #079c9b;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        .signup-link a:hover {
            color: #057574;
        }

        /* Decorative Elements */
        .decoration {
            position: absolute;
            color: #a8dedd;
            opacity: 0.6;
            pointer-events: none;
            z-index: 2;
        }

        .wave-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            overflow: hidden;
            line-height: 0;
            z-index: 1;
        }

        .wave-bg svg {
            position: relative;
            display: block;
            width: calc(100% + 1.3px);
            height: 150px;
        }

        .wave-bg .shape-fill {
            fill: #8bd3d0;
            opacity: 0.7;
        }

        @media (min-width: 601px) {
            body {
                height: 100vh;
                overflow-y: hidden;
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .login-card {
                padding: 30px 24px;
            }

            .login-card h2 {
                font-size: 26px;
            }

            main {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Decorative Elements -->
    <i class="fa-solid fa-book decoration" style="top: 10%; left: 5%; font-size: 60px; transform: rotate(-20deg);"></i>
    <i class="fa-solid fa-graduation-cap decoration" style="top: 20%; right: 8%; font-size: 50px; transform: rotate(15deg);"></i>
    <i class="fa-solid fa-graduation-cap decoration" style="top: 60%; right: 5%; font-size: 45px; transform: rotate(-10deg);"></i>
    <i class="fa-solid fa-backpack decoration" style="bottom: 25%; left: 8%; font-size: 55px; transform: rotate(10deg);"></i>
    <i class="fa-solid fa-book-stack decoration" style="bottom: 20%; right: 10%; font-size: 50px; transform: rotate(-15deg);"></i>
    <i class="fa-solid fa-circle decoration" style="top: 30%; left: 35%; font-size: 12px;"></i>
    <i class="fa-solid fa-circle decoration" style="top: 15%; left: 10%; font-size: 10px;"></i>
    <i class="fa-solid fa-plus decoration" style="top: 25%; left: 40%; font-size: 16px;"></i>
    <i class="fa-solid fa-plus decoration" style="top: 18%; right: 20%; font-size: 18px;"></i>
    <i class="fa-solid fa-circle decoration" style="bottom: 35%; left: 15%; font-size: 14px;"></i>
    <i class="fa-solid fa-circle decoration" style="bottom: 30%; right: 20%; font-size: 12px;"></i>

    <!-- Main Content -->
    <main>
        <div class="login-card">
            <h2>Welcome Back!</h2>
            <p class="subtitle">Login to continue to <a href="frontpage.html">CampusBookHub</a></p>

            <form id="loginForm">
                <!-- Email/Username -->
                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email or username" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <i class="fa-solid fa-eye password-toggle" id="passwordToggle" onclick="togglePassword()"></i>
                    </div>
                </div>

                <!-- Forgot Password -->
                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-envelope"></i> Login
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">or continue with</div>

            <!-- Google Login -->
            <button class="btn-google">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Login with Google
            </button>

            <!-- Sign Up Link -->
            <p class="signup-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </main>

    <!-- Decorative Wave -->
    <div class="wave-bg">
        <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,50 C150,10 350,90 500,40 C650,-10 900,80 1200,50 L1200,120 L0,120 Z" class="shape-fill"></path>
        </svg>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordToggle.classList.remove('fa-eye');
                passwordToggle.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordToggle.classList.remove('fa-eye-slash');
                passwordToggle.classList.add('fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value
                })
            }).then(async function (response) {
                const responseText = await response.text();
                let result;
                try { result = JSON.parse(responseText); } catch (error) { result = { error: responseText || 'Could not log in.' }; }
                if (!response.ok) throw new Error(result.error);
                sessionStorage.setItem('campusBookHubSession', result.sessionToken);
                window.location.href = result.redirect;
            }).catch(function (error) {
                alert(error.message || 'Could not log in.');
            });
        });
    </script>

</body>
</html>
